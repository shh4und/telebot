name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.23'
          cache: true

      - name: Install CGO dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebp-dev

      - name: Verify Go modules
        run: go mod verify

      - name: Build binary check
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -ldflags="-s -w" -o /dev/null ./cmd/bot/main.go

      - name: Run Tests
        run: |
          go test -v ./...
